server:
  port: 8080

spring:
  application:
    name: agentflow-api
  # mock-only demo：不调 LLM（NodeRegistry 全走 MockAgentFunction）、不用数据库（InMemoryCheckpointManager）。
  # spring-ai OpenAI 六自动配置 + AgentFlowAutoConfiguration 在 AgentFlowApiApplication 注解级 exclude。
  # JDBC DataSource 自动配置位于 spring-boot-jdbc 模块（Boot 4.1 包 org.springframework.boot.jdbc.autoconfigure），
  # 不在本模块编译类路径，故此处用字符串排除（无 DB + InMemory——避免无 driver/URL 时 Hikari 启动失败）。
  autoconfigure:
    exclude: "org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration"

agentflow:
  api:
    # 合法 X-API-Key（逗号分隔，env AGENTFLOW_API_KEYS 可覆盖整行）。
    # UI 默认 demo-key-1234567890abcdef 由 ApiConfig 恒注册（与 api.ts 一致）。
    api-keys: "other-demo-key"
  mock:
    # mock LLM 记账（Token/成本 Grafana 面板数据源）：模拟的模型名（成本查表）+ 预算阈值（USD，留空禁用）。
    # 预算阈值此处为 demo 演示用低阈值（1e-5，单个工作流即触发 budget_exceeded 让面板有数据）；生产按真实预算覆盖 env。
    model: gpt-4o-mini
    budget-threshold-usd: 0.00001

# Actuator：暴露 prometheus 端点（默认只暴露 health）供 Prometheus/Grafana 抓取 AgentFlowMetrics 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.agentflow: INFO
