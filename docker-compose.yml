# AgentFlow Docker Compose（统一入口，U13）
#
# Mock 模式：零基础设施，一键启动 → 跑通 Demo
#   docker compose --profile mock up
#
# 生产模式：PG + Redis + API 端点
#   docker compose --profile production up
#
# 可观测：Prometheus + Grafana（v1 档 A 部署验证）
#   docker compose --profile observability up -d
#   # Grafana http://localhost:3000（admin/admin），dashboard 自动加载
#
# 分布式（v1.1）：Kafka（KRaft，免 Zookeeper）
#   docker compose --profile distributed up -d

services:

  # ── Mock 模式：Demo 应用 + 零外部依赖 ──
  agentflow-mock:
    build:
      context: .
      dockerfile: demo-supplier-risk/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mock
      - agentflow.mock.enabled=true
    profiles:
      - mock

  # ── MVP：合同审查雏形（demo-api 可执行 JAR，单容器零依赖）──
  #   构建前提：先在宿主机 `mvn -s settings.xml -B -ntp -pl demo-api -am package -DskipTests`
  #   起服务：  docker compose --profile mvp up -d --build
  #   不需要 PG / Redis / Kafka / LLM key —— demo-api 用 InMemoryCheckpointManager，
  #   agent 走 mock，dispatcher 走本地虚拟线程。
  demo-api:
    build:
      context: .
      dockerfile: demo-api/Dockerfile
    image: agentflow-demo-api:local
    ports:
      - "8080:8080"
    profiles:
      - mvp

  # ── 生产模式：PG + Redis ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentflow}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - production

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - production

  agentflow-api:
    build:
      context: .
      dockerfile: demo-supplier-risk/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agentflow
      - SPRING_DATASOURCE_USERNAME=agentflow
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-agentflow}
      - SPRING_REDIS_HOST=redis
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY}
      - agentflow.mock.enabled=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - production

  # ── v1.1 分布式模式：Kafka（apache/kafka，KRaft 免 Zookeeper）──
  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - distributed

  # ── 可观测：Prometheus + Grafana（v1 档 A 部署验证）──
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./agentflow-starter/src/main/resources/grafana/agentflow-dashboard.json:/var/lib/grafana/dashboards/agentflow-dashboard.json:ro
    depends_on:
      - prometheus
    profiles:
      - observability

volumes:
  pg-data:
