# 投资分析决策工作流（U12 辅 Demo 2，R17）
#
# 拓扑：双层 fork-join 混合（6 节点 4 super-step）
#   super-step 0：company-finance + market-data（2 并行，入度 0）
#   super-step 1：feasibility-analysis（1 串行，依赖 step 0 两路）
#   super-step 2：risk-assessment + return-forecast（2 并行，依赖 step 1）
#   super-step 3：investment-decision（1 汇总，依赖 step 2 两路 + 引用前 3 层全部输出）
#
# 验证 BSP 最长路径分层（DAGLayerer.computeSuperSteps）对复杂混合拓扑的泛用性。
# MockAgentFunction 返回 AgentOutput.of(content)，引擎按 channel=nodeId 写入；
# 下游 mock_response 用 ${channel} 占位符引用上游输出，验证上下文跨 super-step 传递。
#
# 命名约定：node id / channel 用连字符（与 U10 demo-supplier-risk、U11 demo-contract-review 一致）。
# MockAgentFunction 占位符正则 [\w.-] 已支持连字符（U11 修复），channel=nodeId 便捷约定下
# 连字符 channel 名可被 ${...} 正确解析替换。

agentflow:
  version: "1.0"

channels:
  company-finance:
    reducer: overwrite
  market-data:
    reducer: overwrite
  feasibility-analysis:
    reducer: overwrite
  risk-assessment:
    reducer: overwrite
  return-forecast:
    reducer: overwrite
  investment-decision:
    reducer: overwrite

nodes:
  # ─── super-step 0：基础信息并行采集（2 节点） ───
  - id: company-finance
    agent: finance-agent
    prompt_template: "采集标的 ${target} 的公司财报：营收、利润、现金流"
    mock_response: |
      公司财报：
      营收：120 亿（同比 +18%）
      净利润：22 亿（同比 +25%）
      经营现金流：28 亿（连续 3 年为正）
      资产负债率：38%（健康）

  - id: market-data
    agent: market-agent
    prompt_template: "采集标的 ${target} 的市场数据：行业景气、估值、情绪"
    mock_response: |
      市场数据：
      行业景气度：高（政策利好）
      PE：22 倍（低于行业中位 28 倍）
      近 30 日北向资金：净流入 8.5 亿
      舆论情绪：偏多

  # ─── super-step 1：可行性分析（串行，依赖 step 0 两路） ───
  - id: feasibility-analysis
    agent: feasibility-agent
    prompt_template: |
      综合财报与市场数据，输出可行性结论：
      财报：${company-finance}
      市场：${market-data}
    mock_response: |
      可行性分析：
      基本面：优秀（营收/利润双增，现金流稳健）
      估值：偏低（PE 22 < 中位 28，安全边际充足）
      结论：具备投资可行性，建议进入风险评估与收益预测环节
      引用上游财报：${company-finance}
      引用上游市场：${market-data}

  # ─── super-step 2：风险评估 + 收益预测（2 并行，依赖 step 1） ───
  - id: risk-assessment
    agent: risk-agent
    prompt_template: |
      基于可行性结论做风险评估：
      可行性：${feasibility-analysis}
    mock_response: |
      风险评估：
      市场风险：中（行业景气高但情绪波动）
      财务风险：低（资产负债率 38% 健康）
      流动性风险：低
      综合风险等级：MEDIUM
      引用可行性：${feasibility-analysis}

  - id: return-forecast
    agent: return-agent
    prompt_template: |
      基于可行性结论做收益预测：
      可行性：${feasibility-analysis}
    mock_response: |
      收益预测：
      12 个月目标价涨幅：+22%
      年化预期收益率：18%
      上行概率：65%
      下行保护（估值底）：-8%
      引用可行性：${feasibility-analysis}

  # ─── super-step 3：投资裁决（汇总，依赖 step 2 两路 + 引用前 3 层全部输出） ───
  - id: investment-decision
    agent: decision-agent
    prompt_template: |
      汇总前 3 层全部输出，输出投资裁决 JSON：
      财报：${company-finance}
      市场：${market-data}
      可行性：${feasibility-analysis}
      风险：${risk-assessment}
      收益：${return-forecast}
    mock_response: |
      {"riskLevel":"MEDIUM","confidence":0.82,"evidence":["汇总前3层全部输出"],"recommendation":"建议买入，仓位 60%，止损位 -8%","upstream":{"finance":"${company-finance}","market":"${market-data}","feasibility":"${feasibility-analysis}","risk":"${risk-assessment}","return":"${return-forecast}"}}

edges:
  - { from: company-finance, to: feasibility-analysis }
  - { from: market-data, to: feasibility-analysis }
  - { from: feasibility-analysis, to: risk-assessment }
  - { from: feasibility-analysis, to: return-forecast }
  - { from: risk-assessment, to: investment-decision }
  - { from: return-forecast, to: investment-decision }
